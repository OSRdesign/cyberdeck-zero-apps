<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinyl output chooser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.row{position:absolute;left:0;width:464px;height:40px;color:#ddd;font-size:15px;font-weight:600}
.dot{position:absolute;left:16px;top:15px;width:10px;height:10px;border-radius:50%}
.t{position:absolute;left:40px;top:0;width:250px;line-height:40px;white-space:nowrap;overflow:hidden}
.v{position:absolute;right:38px;top:0;line-height:40px;font-size:12px;font-weight:600;color:#9a9a9a;white-space:nowrap}
.ch{position:absolute;right:14px;top:12px}
</style>
</helmet>
<div style="position:relative;width:480px;height:320px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif">
  <div style="position:absolute;left:219px;top:8px;width:40px;height:27px;border-radius:10px;background:#222;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Esc</div>
  <div style="position:absolute;left:8px;top:8px;width:120px;height:27px;border-radius:6px;background:#222;color:#eee;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Output</div>
  <div style="position:absolute;left:8px;top:44px;width:464px;height:268px;border-radius:10px;background:#1b1e1e;overflow:hidden">
    <div style="position:absolute;left:0;top:6px;width:464px">
      <div class="row" style="top:0;background:#2a2a2a"><div class="dot" style="background:#3b82f6"></div><div class="t">Automatic</div><div class="v">follows system: Evolve 65</div><svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row" style="top:40px"><div class="dot" style="background:#fff"></div><div class="t">Evolve 65</div><div class="v">music quality</div><svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row" style="top:80px"><div class="dot" style="background:#fff"></div><div class="t">USB sound card UC02</div><div class="v">wired</div><svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row" style="top:120px"><div class="dot" style="background:#fff"></div><div class="t">HDMI</div><div class="v">wired</div><svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row" style="top:160px;color:#7a7a7a"><div class="dot" style="background:#555"></div><div class="t">XWF speaker</div><div class="v">paired, not connected</div><svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <!-- hint strip -->
    <div style="position:absolute;left:8px;top:218px;width:448px;height:42px;border-radius:8px;background:#dcd4bd;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:#3b3828;line-height:16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b3828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      Pairing is in Settings. Vinyl never switches output by itself while a track plays.
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
