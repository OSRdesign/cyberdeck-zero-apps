<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinyl sleep timer</title>
<script src="./support.js"></script>
</head>
<body>
<!-- branding-allow-begin: SVG path data (a move-to command to x 5 reads like the brand word) -->
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.row{position:absolute;left:0;width:464px;height:34px;color:#ddd;font-size:15px;font-weight:600}
.dot{position:absolute;left:16px;top:12px;width:10px;height:10px;border-radius:50%;background:#fff}
.t{position:absolute;left:40px;top:0;line-height:34px}
</style>
</helmet>
<div style="position:relative;width:480px;height:320px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif">
  <div style="position:absolute;left:12px;top:2px;line-height:40px;font-size:26px;font-weight:600;color:#F0B400">Sleep timer</div>
  <svg style="position:absolute;right:88px;top:10px" width="30" height="24" viewBox="0 0 30 24" aria-label="Wi-Fi signal"><rect x="1" y="16" width="4" height="6" rx="1" fill="#777"/><rect x="8" y="12" width="4" height="10" rx="1" fill="#777"/><rect x="15" y="8" width="4" height="14" rx="1" fill="#777"/><rect x="22" y="3" width="4" height="19" rx="1" fill="#777"/></svg>
  <div style="position:absolute;right:8px;top:6px;width:70px;height:30px;border-radius:6px;background:#8a5a2b;color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center">12:00</div>
  <div style="position:absolute;left:219px;top:8px;width:40px;height:27px;border-radius:10px;background:#222;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Esc</div>
  <div style="position:absolute;left:8px;top:44px;width:464px;height:268px;border-radius:10px;background:#1b1e1e;overflow:hidden">
    <div style="position:absolute;left:16px;top:0;line-height:30px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#9a9a9a">STOP PLAYING AFTER</div>
    <div style="position:absolute;left:0;top:30px;width:464px">
      <div class="row" style="top:0"><div class="dot"></div><div class="t">Off</div></div>
      <div class="row" style="top:34px"><div class="dot"></div><div class="t">15 minutes</div></div>
      <div class="row" style="top:68px;background:#2a2a2a"><div class="dot" style="background:#3b82f6"></div><div class="t">30 minutes</div></div>
      <div class="row" style="top:102px"><div class="dot"></div><div class="t">60 minutes</div></div>
      <div class="row" style="top:136px"><div class="dot"></div><div class="t">This track</div></div>
      <div class="row" style="top:170px"><div class="dot"></div><div class="t">This album or playlist</div></div>
    </div>
    <div style="position:absolute;left:8px;top:218px;width:448px;height:42px;border-radius:8px;background:#dcd4bd;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#3b3828">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b3828" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      Stops in 29:12. The music fades out for the last 10 seconds.
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
<!-- branding-allow-end -->
</body>
</html>
