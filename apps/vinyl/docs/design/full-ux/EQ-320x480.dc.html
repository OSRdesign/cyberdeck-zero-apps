<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinyl equalizer portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.trk{position:absolute;top:56px;width:24px;height:210px;border-radius:5px;background:#2a2a2a}
.mid{position:absolute;left:0;top:105px;width:24px;height:1px;background:#555}
.up{position:absolute;left:0;width:24px;border-radius:5px 5px 0 0;background:#1f7a72}
.dn{position:absolute;left:0;top:105px;width:24px;border-radius:0 0 5px 5px;background:#1f7a72}
.fl{position:absolute;top:270px;width:24px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;color:#9a9a9a;line-height:14px}
.bt{position:absolute;height:46px;border-radius:8px;background:#b9b19b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#222}
</style>
</helmet>
<div style="position:relative;width:320px;height:480px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif">
  <div style="position:absolute;left:8px;top:8px;width:40px;height:27px;border-radius:10px;background:#222;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Esc</div>
  <svg style="position:absolute;right:88px;top:10px" width="30" height="24" viewBox="0 0 30 24" aria-label="Wi-Fi signal"><rect x="1" y="16" width="4" height="6" rx="1" fill="#777"/><rect x="8" y="12" width="4" height="10" rx="1" fill="#777"/><rect x="15" y="8" width="4" height="14" rx="1" fill="#777"/><rect x="22" y="3" width="4" height="19" rx="1" fill="#777"/></svg>
  <div style="position:absolute;right:8px;top:6px;width:70px;height:30px;border-radius:6px;background:#8a5a2b;color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center">12:00</div>
  <div style="position:absolute;left:8px;top:44px;width:304px;height:428px;border-radius:10px;background:#1b1e1e;overflow:hidden">
    <div style="position:absolute;left:14px;top:6px;line-height:24px;font-size:14px;font-weight:700;color:#ddd">Band 4 kHz: <span style="color:#1f7a72;background:#dcd4bd;border-radius:4px;padding:1px 8px">+3 dB</span></div>
    <div style="position:absolute;left:14px;top:32px;line-height:18px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#9a9a9a">PRESET: BASS BOOST</div>
    <div style="position:absolute;left:14px;top:0;width:280px;height:300px">
      <div class="trk" style="left:0"><div class="mid"></div><div class="up" style="top:70px;height:35px"></div></div><div class="fl" style="left:0">31</div>
      <div class="trk" style="left:28px"><div class="mid"></div><div class="up" style="top:83px;height:22px"></div></div><div class="fl" style="left:28px">62</div>
      <div class="trk" style="left:56px"><div class="mid"></div></div><div class="fl" style="left:56px">125</div>
      <div class="trk" style="left:84px"><div class="mid"></div><div class="dn" style="height:12px"></div></div><div class="fl" style="left:84px">250</div>
      <div class="trk" style="left:112px"><div class="mid"></div></div><div class="fl" style="left:112px">500</div>
      <div class="trk" style="left:140px"><div class="mid"></div><div class="up" style="top:93px;height:12px"></div></div><div class="fl" style="left:140px">1k</div>
      <div class="trk" style="left:168px"><div class="mid"></div><div class="up" style="top:83px;height:22px"></div></div><div class="fl" style="left:168px">2k</div>
      <div class="trk" style="left:196px;outline:3px solid #dcd4bd"><div class="mid"></div><div class="up" style="top:70px;height:35px"></div></div><div class="fl" style="left:196px;color:#dcd4bd;font-weight:700">4k</div>
      <div class="trk" style="left:224px"><div class="mid"></div><div class="up" style="top:83px;height:22px"></div></div><div class="fl" style="left:224px">8k</div>
      <div class="trk" style="left:252px"><div class="mid"></div><div class="up" style="top:93px;height:12px"></div></div><div class="fl" style="left:252px">16k</div>
    </div>
    <div class="bt" style="left:14px;top:300px;width:64px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" aria-label="Lower the band"><path d="M 5 12h14"/></svg></div>
    <div class="bt" style="left:86px;top:300px;width:64px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" aria-label="Raise the band"><path d="M 5 12h14M 12 5v14"/></svg></div>
    <div class="bt" style="left:158px;top:300px;width:132px;background:#1f7a72;color:#fff">On</div>
    <div class="bt" style="left:14px;top:356px;width:136px">Preset</div>
    <div class="bt" style="left:158px;top:356px;width:132px">Reset</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
