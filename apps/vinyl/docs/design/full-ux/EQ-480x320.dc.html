<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinyl equalizer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.trk{position:absolute;top:30px;width:38px;height:110px;border-radius:5px;background:#2a2a2a}
.mid{position:absolute;left:0;top:55px;width:38px;height:1px;background:#555}
.up{position:absolute;left:0;width:38px;border-radius:5px 5px 0 0;background:#1f7a72}
.dn{position:absolute;left:0;top:55px;width:38px;border-radius:0 0 5px 5px;background:#1f7a72}
.fl{position:absolute;top:144px;width:38px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11px;color:#9a9a9a;line-height:14px}
.bt{position:absolute;top:218px;height:42px;border-radius:8px;background:#b9b19b;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;color:#222}
</style>
</helmet>
<div style="position:relative;width:480px;height:320px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif">
  <div style="position:absolute;left:12px;top:2px;line-height:40px;font-size:26px;font-weight:600;color:#F0B400">Equalizer</div>
  <svg style="position:absolute;right:88px;top:10px" width="30" height="24" viewBox="0 0 30 24" aria-label="Wi-Fi signal"><rect x="1" y="16" width="4" height="6" rx="1" fill="#777"/><rect x="8" y="12" width="4" height="10" rx="1" fill="#777"/><rect x="15" y="8" width="4" height="14" rx="1" fill="#777"/><rect x="22" y="3" width="4" height="19" rx="1" fill="#777"/></svg>
  <div style="position:absolute;right:8px;top:6px;width:70px;height:30px;border-radius:6px;background:#8a5a2b;color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center">12:00</div>
  <div style="position:absolute;left:219px;top:8px;width:40px;height:27px;border-radius:10px;background:#222;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Esc</div>
  <div style="position:absolute;left:8px;top:44px;width:464px;height:268px;border-radius:10px;background:#1b1e1e;overflow:hidden">
    <div style="position:absolute;left:16px;top:2px;line-height:24px;font-size:13px;font-weight:700;color:#ddd">Band 4 kHz: <span style="color:#1f7a72;background:#dcd4bd;border-radius:4px;padding:1px 8px">+3 dB</span></div>
    <div style="position:absolute;right:16px;top:2px;line-height:24px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#9a9a9a">PRESET: BASS BOOST</div>
    <div style="position:absolute;left:15px;top:0;width:434px;height:170px">
      <div class="trk" style="left:0"><div class="mid"></div><div class="up" style="top:41px;height:14px"></div></div><div class="fl" style="left:0">31</div>
      <div class="trk" style="left:44px"><div class="mid"></div><div class="up" style="top:46px;height:9px"></div></div><div class="fl" style="left:44px">62</div>
      <div class="trk" style="left:88px"><div class="mid"></div></div><div class="fl" style="left:88px">125</div>
      <div class="trk" style="left:132px"><div class="mid"></div><div class="dn" style="height:5px"></div></div><div class="fl" style="left:132px">250</div>
      <div class="trk" style="left:176px"><div class="mid"></div></div><div class="fl" style="left:176px">500</div>
      <div class="trk" style="left:220px"><div class="mid"></div><div class="up" style="top:50px;height:5px"></div></div><div class="fl" style="left:220px">1k</div>
      <div class="trk" style="left:264px"><div class="mid"></div><div class="up" style="top:46px;height:9px"></div></div><div class="fl" style="left:264px">2k</div>
      <div class="trk" style="left:308px;outline:3px solid #dcd4bd"><div class="mid"></div><div class="up" style="top:41px;height:14px"></div></div><div class="fl" style="left:308px;color:#dcd4bd;font-weight:700">4k</div>
      <div class="trk" style="left:352px"><div class="mid"></div><div class="up" style="top:46px;height:9px"></div></div><div class="fl" style="left:352px">8k</div>
      <div class="trk" style="left:396px"><div class="mid"></div><div class="up" style="top:50px;height:5px"></div></div><div class="fl" style="left:396px">16k</div>
    </div>
    <div class="bt" style="left:8px;width:56px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" aria-label="Lower the band"><path d="M 5 12h14"/></svg></div>
    <div class="bt" style="left:68px;width:56px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" aria-label="Raise the band"><path d="M 5 12h14M 12 5v14"/></svg></div>
    <div class="bt" style="left:134px;width:150px">Preset</div>
    <div class="bt" style="left:290px;width:80px">Reset</div>
    <div class="bt" style="left:376px;width:80px;background:#1f7a72;color:#fff">On</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
